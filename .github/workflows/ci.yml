name: CI

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package import smoke
        run: node --input-type=module -e "import('./dist/index.js').then(m => { if (!m.CloudResourceRegistry) process.exit(1); })"
      - run: npm audit --omit=dev --audit-level=high
